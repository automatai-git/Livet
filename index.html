<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Personal productivity and wellness tracking applications">
    
    <!-- PWA settings -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=3" />
    <meta name="theme-color" content="#1B3B2F" />

    <!-- iOS Native styling -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Livet">

    <!-- v3 tree mark, shared across all sub-apps. iOS needs a raster icon;
         the ?v= query forces a re-fetch on next "Add to Home Screen". -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=3">

    <title>Life & Training Hub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Never register the SW against the Vite dev server: its
          // cache-first asset strategy pins the unhashed /src modules to
          // stale copies, so code edits silently stop reaching the browser.
          // Also self-heal dev browsers that picked one up earlier.
          if (['localhost', '127.0.0.1'].includes(location.hostname)) {
            navigator.serviceWorker.getRegistrations()
              .then((regs) => regs.forEach((r) => r.unregister()))
              .catch(() => {});
            if (window.caches) {
              caches.keys().then((keys) => keys.forEach((k) => caches.delete(k))).catch(() => {});
            }
            return;
          }
          navigator.serviceWorker.register('service-worker.js')
            .then(() => console.log('SW registered'))
            .catch(err => console.log('SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
