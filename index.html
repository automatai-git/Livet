<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Personal productivity and wellness tracking applications">
    
    <!-- PWA settings -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1B3B2F" />

    <!-- iOS Native styling -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Hub">
    
    <!-- We generate a placeholder icon natively if missing, but it's best handled in manifest.json and apple-touch-icon -->
    <link rel="apple-touch-icon" href="/icon.png">

    <title>Life & Training Hub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(registration => console.log('SW registered'))
            .catch(err => console.log('SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
